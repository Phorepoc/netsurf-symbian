# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): the NetSurf engine as a
# web-engine plug-in, which the browser finds once it is installed
NAME=netsurf-symbian
ARCHES="arm x32"
# tls: mbedTLS and the certificates the engine trusts; webengine: the plug-in interface
REPOS_arm="tls webengine"
REPOS_x32="tls webengine"
COMPONENTS_arm="phewebengine_netsurf_arm"
COMPONENTS_x32="phewebengine_netsurf"
